services:
  - type: web
    name: valuation-tool
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "10000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
